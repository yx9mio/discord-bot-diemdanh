name: Restore session handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor == 'yx9mio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and repair handler
        run: |
          curl -fsSL https://raw.githubusercontent.com/yx9mio/discord-bot-diemdanh/59ba21ae123bed77cfcc9156b16e01a717c78b61/src/interaction-handlers/sessionButton.js -o src/interaction-handlers/sessionButton.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/interaction-handlers/sessionButton.js')
          s = p.read_text()
          s = s.replace(" +\\n            '>", " +
            '>")
          p.write_text(s)
          PY
          rm .github/workflows/restore-session-handler.yml
          node --check src/interaction-handlers/sessionButton.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[users.noreply.github.com
          git add src/interaction-handlers/sessionButton.js .github/workflows/restore-session-handler.yml
          git commit -m "fix(ci): restore session handler and repair syntax"
          git push
